name: Phone Input Bridge Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/phone-input-bridge-mvp
    paths:
      - "android/inputbridge/**"
      - "android/settings.gradle.kts"
      - "phone-input-bridge/**"
      - ".github/workflows/phone-input-bridge.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/inputbridge/**"
      - "android/settings.gradle.kts"
      - "phone-input-bridge/**"
      - ".github/workflows/phone-input-bridge.yml"

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :inputbridge:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-input-bridge-android-debug
          path: android/inputbridge/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Build Windows agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release EXE
        run: cargo build --release --manifest-path phone-input-bridge/windows-agent/Cargo.toml

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item phone-input-bridge/windows-agent/target/release/phone-input-bridge-agent.exe dist/
          Copy-Item phone-input-bridge/README.md dist/

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: phone-input-bridge-windows
          path: dist/*
          if-no-files-found: error
