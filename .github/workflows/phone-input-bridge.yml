name: Phone Input Bridge Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/phone-input-bridge-mvp
    paths:
      - "android/inputbridge/**"
      - "android/settings.gradle.kts"
      - "phone-input-bridge/**"
      - ".github/workflows/phone-input-bridge.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/inputbridge/**"
      - "android/settings.gradle.kts"
      - "phone-input-bridge/**"
      - ".github/workflows/phone-input-bridge.yml"

permissions:
  contents: write

jobs:
  patch-source:
    name: Apply Android source fix
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/phone-input-bridge-mvp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phone-input-bridge-mvp

      - name: Remove invalid Compose import and commit
        shell: bash
        run: |
          FILE="android/inputbridge/src/main/java/com/feihu/phoneinput/MainActivity.kt"
          sed -i '/import androidx.compose.foundation.layout.weight/d' "$FILE"
          if git diff --quiet -- "$FILE"; then
            echo "Source is already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "fix: use scoped Compose weight modifier"
          git push origin HEAD:agent/phone-input-bridge-mvp

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply source compatibility fix
        shell: bash
        run: |
          sed -i '/import androidx.compose.foundation.layout.weight/d' \
            android/inputbridge/src/main/java/com/feihu/phoneinput/MainActivity.kt

      - name: Build debug APK
        id: android_build
        continue-on-error: true
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :inputbridge:assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-input-bridge-android-build-log
          path: android/android-build.log
          if-no-files-found: error

      - name: Upload Android APK
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phone-input-bridge-android-debug
          path: android/inputbridge/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail when Android build fails
        if: steps.android_build.outcome != 'success'
        run: exit 1

  windows:
    name: Build Windows agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release EXE
        run: cargo build --release --manifest-path phone-input-bridge/windows-agent/Cargo.toml

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item phone-input-bridge/windows-agent/target/release/phone-input-bridge-agent.exe dist/
          Copy-Item phone-input-bridge/README.md dist/

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: phone-input-bridge-windows
          path: dist/*
          if-no-files-found: error
